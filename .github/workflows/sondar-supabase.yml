# Confere quais partes do banco já foram ligadas (sem criar nem mudar nada)
name: Conferir o banco
on: workflow_dispatch
permissions:
  contents: read
jobs:
  sondar:
    runs-on: ubuntu-24.04
    steps:
      - env:
          URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          for t in vaults shared_trips trip_members trip_invites public_trips; do
            echo "tabela $t: $(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/$t?select=*&limit=0" -H "apikey: $KEY")"
          done
          # cada função é chamada com dados inválidos de propósito: "não existe" (PGRST202) = falta rodar o SQL; outro erro = a função existe
          call() { r=$(curl -s -X POST "$URL/rest/v1/rpc/$1" -H "apikey: $KEY" -H 'Content-Type: application/json' -d "$2"); if echo "$r" | grep -q PGRST202; then echo "função $1: FALTA"; else echo "função $1: ok"; fi; }
          call get_public_trip '{"pid":"x"}'
          call join_trip '{"invite":"x","member_name":"x"}'
          call public_id_for_trip '{"tid":"x"}'
          call invite_info '{"invite":"x"}'
          call publish_guest_trip '{"pid":"x","tid":"x","payload":{}}'
          call update_guest_trip '{"pid":"x","tok":"x","payload":{}}'
          call delete_guest_trip '{"pid":"x","tok":"x"}'
