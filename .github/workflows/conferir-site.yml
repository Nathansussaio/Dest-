# Confere o site publicado de verdade (depois de cada publicação, ou à mão em Actions › Conferir o site publicado).
# Abre cada endereço público e confere o status (200) e o conteúdo; depois roda os testes de tela no endereço real.
name: Conferir o site publicado
on:
  workflow_run:
    workflows: ['Publicar o site']
    types: [completed]
  workflow_dispatch:
    inputs:
      manter_link:
        description: 'Manter a conta de teste e o link público de exemplo (não excluir no fim)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  conferir:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SITE: ${{ vars.SITE_URL || 'https://nathansussaio.github.io/Dest-' }}
    steps:
      - uses: actions/checkout@v5
      - name: Esperar o GitHub Pages atualizar
        run: |
          # compara o arquivo principal do app no repositório com o que está no ar
          # (o "?v=" pula a cópia de até 10 minutos que o GitHub guarda)
          want=$(grep -o '_expo/static/js/web/index-[0-9a-f]*\.js' index.html | head -1)
          echo "versão no repositório: $want"
          for i in $(seq 1 40); do
            got=$(curl -s "$SITE/viagens/?v=$RANDOM$i" | grep -o '_expo/static/js/web/index-[0-9a-f]*\.js' | head -1)
            if [ -n "$want" ] && [ "$got" = "$want" ]; then echo "versão nova no ar: $got"; exit 0; fi
            sleep 10
          done
          echo "::warning::a versão nova ainda não apareceu (no ar: $got); conferindo a que está no ar"
      - name: Status de cada endereço (sem seguir redirecionamento, depois seguindo)
        run: |
          fail=0
          host=$(echo "$SITE" | grep -o '^https://[^/]*')
          check() {
            first=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/$1")
            final=$(curl -s -o /tmp/p.html -w '%{http_code}' -L "$SITE/$1")
            title=$(grep -o '<title>[^<]*' /tmp/p.html | head -1 | cut -c8-)
            legacy=$(grep -c 'legacyTarget' /tmp/p.html || true)
            echo "$first → $final  /$1  ·  $title$( [ "$legacy" != "0" ] && echo '  · (404.html troca pelo endereço novo antes de abrir o app)')"
            [ "$final" = "$2" ] || { echo "::error::/$1 terminou em $final (esperado $2)"; fail=1; }
          }
          for r in "" inicio inicio/ viagens viagens/ explorar explorar/ gastos gastos/ perfil perfil/ nova-viagem nova-viagem/ \
                   viagem viagem/ "viagem/?id=ID_INVALIDO" "viagem/?id=ID_INVALIDO&" convite convite/ \
                   "roteiro/?id=ID_INVALIDO" "convite/?c=CODIGO_INVALIDO" entrar/ criar-conta/ "viagem/?id=t1_teste" \
                   privacidade.html termos.html og-image.png favicon.png manifest.json robots.txt sitemap.xml; do check "$r" 200; done
          # endereços antigos e inexistentes: o GitHub Pages responde 404 com o 404.html (que é o app)
          for r in convite/CODIGO_INVALIDO convite/CODIGO_INVALIDO/ viagem/ID_INVALIDO viagem/ID_INVALIDO/ viagem/t1_mw7a2q6r convite/GJF5TM33 endereco-que-nao-existe; do check "$r" 404; done
          # o _redirects (para hospedagens com regras) foi publicado
          check _redirects 200
          for js in $(curl -s "$SITE/viagens/" | grep -o '/[^"]*_expo/static/js/web/[^"]*\.js' | sort -u); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$host$js"); echo "$code  $js"; [ "$code" = "200" ] || fail=1
          done
          exit $fail
      - name: Testes de tela no endereço real (Chromium, Firefox e Safari)
        run: |
          mkdir -p /tmp/e2e && cp app/tests-e2e/smoke.mjs /tmp/e2e/
          docker run --rm --ipc=host --network host -v /tmp/e2e:/e2e -w /e2e mcr.microsoft.com/playwright:v1.56.0-noble bash -c "
            npm install --no-save --no-audit --no-fund playwright@1.56.0 > /dev/null &&
            node smoke.mjs $SITE/"
      - name: Link público de verdade (conta de teste temporária, janela anônima nos 3 navegadores)
        run: |
          cp app/tests-e2e/public-link.mjs /tmp/e2e/
          docker run --rm --ipc=host --network host -e GITHUB_RUN_ID -v /tmp/e2e:/e2e -w /e2e mcr.microsoft.com/playwright:v1.56.0-noble bash -c "
            node public-link.mjs $SITE/ ${{ inputs.manter_link && 'manter' || '' }}"
