    <style>
  /* App em tela cheia: o conteúdo vem do próprio app (mesmo código do iPhone e Android) */
  :root { --bg: #F4F4F1; --fg: #1B1C1E; --acc: #0B6670; box-sizing: border-box; height: 100%; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #111214; --fg: #ECECE9; --acc: #62C3CC; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #111214; --fg: #ECECE9; --acc: #62C3CC; color-scheme: dark; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  #root { height: 100%; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  .sv::-webkit-scrollbar { width: 0; height: 0; }
  input::placeholder { color: #A0A2A6; }
  :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  .loading { margin: auto; color: var(--acc); font-weight: 700; font-size: 20px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

<script>window.process = { env: { EXPO_PUBLIC_SITE_URL: 'https://nathansussaio.github.io/dest-' } }; window.__PLATFORM = 'web';</script>
<script src="app.js"></script>
</body>
